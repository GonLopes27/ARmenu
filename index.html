<!DOCTYPE html>
<html lang="pt">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Menu</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <link rel="stylesheet" href="css/styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
</head>

<body>
  <header class="main-header">
    <div class="logo-row">
      <img src="assets/images/logo.png" class="logo-icon" />
      <span class="logo-text">Menu-AR</span>
    </div>
    <img src="assets/images/info.png" class="info-icon" alt="Informações">
  </header>

  <nav id="category-buttons" class="categoryBtns">
    <button data-category="entradas" class="active">Entradas</button>
    <button data-category="carne">Carne</button>
    <button data-category="peixe">Peixe</button>
    <button data-category="sobremesa">Sobremesas</button>
    <div class="active-indicator"></div>
  </nav>

  <main id="dish-container">
    <h2 id="secao-carne" data-category="carne">Pratos de Carne:</h2>

    <button class="dish-card padding-sm">
      <img src="assets/images/EstrogonofeRender.png" alt="Estrogonofe" />
      <div class="info">
        <h3 class="dish-title">Estrogonofe</h3>
        <div class="rating-price">
          <img src="assets/images/star.png" alt="Estrela" class="star" />
          <span class="rating">4,5</span>
          <span class="dot-char">●</span>
          <span class="price">12,00€</span>
        </div>
        <p class="description">Estrogonofe de carne com molho cremoso, acompanhado de arroz e batata palha.</p>
      </div>
    </button>

    <div style="height: 20vh;"></div>
  </main>

  <!-- Popup -->
  <div id="dish-popup-overlay" class="popup-overlay hidden"></div>

  <div id="dish-popup" class="dish-popup hidden">
    <div class="popup-drag-bar"></div>

    <div class="popup-toggle">
      <span class="active">Imagem</span>
      <span>3D</span>
    </div>

    <div class="popup-image">
      <img src="" alt="Imagem do prato" id="popup-img">
    </div>

    <div class="popup-content">
      <h3 id="popup-title">[Nome do Prato]</h3>
      <div class="popup-meta">
        <img src="assets/images/star.png" class="popup-star" alt="Estrela">
        <span class="rating" id="popup-rating">[avaliação]</span>
        <span class="dot-char">●</span>
        <span class="price" id="popup-price">[preço]</span>
      </div>

      <p id="popup-description">[Descrição do prato...]</p>

      <button class="ar-btn" id="ar-btn">Ver Prato na Mesa com AR</button>

    </div>
  </div>

  <script src="script/script.js"></script>

  <model-viewer id="ar-viewer"
  src="assets/models/Estrogonofe.glb"
  ios-src="assets/models/Estrogonofe.usdz"
  ar
  ar-modes="scene-viewer quick-look webxr"
  camera-controls
  style="display: none;">
</model-viewer>

</body>

</html>

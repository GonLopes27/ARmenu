<!DOCTYPE html>
<html lang="pt">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Menu</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
</head>

<body>

  <header class="main-header">
    <div class="logo-row">
      <img src="assets/images/logo.png" class="logo-icon" />
      <span class="logo-text">Menu-AR</span>
    </div>
    <img src="assets/images/info.png" class="info-icon" alt="Informações">
  </header>

  <nav id="category-buttons" class="categoryBtns">
    <button data-category="entradas" class="active">Entradas</button>
    <button data-category="carne">Carne</button>
    <button data-category="peixe">Peixe</button>
    <button data-category="sobremesa">Sobremesas</button>
    <div class="active-indicator"></div>
  </nav>

  <main id="dish-container">

    <!-- ENTRADAS -->
    <h2 id="secao-entradas" data-category="entradas">Pratos de Entrada:</h2>

    <button class="dish-card padding-sm">
      <img src="assets/images/placeholderDuck.png" alt="Pão com Manteiga" />
      <div class="info">
        <h3 class="dish-title">Pão com Manteiga</h3>
        <div class="rating-price">
          <img src="assets/images/star.png" alt="Estrela" class="star" />
          <span class="rating">3,5</span>
          <span class="dot-char">●</span>
          <span class="price">3,00€</span>
        </div>
        <p class="description">Pão fresco torrado servido com manteiga derretida.</p>
      </div>
    </button>

    <button class="dish-card padding-sm">
      <img src="assets/images/placeholderDuck.png" alt="Sopa de Legumes" />
      <div class="info">
        <h3 class="dish-title">Sopa de Legumes</h3>
        <div class="rating-price">
          <img src="assets/images/star.png" alt="Estrela" class="star" />
          <span class="rating">3,9</span>
          <span class="dot-char">●</span>
          <span class="price">3,50€</span>
        </div>
        <p class="description">Creme de legumes variados com temperos caseiros.</p>
      </div>
    </button>

    <!-- CARNE -->
    <h2 id="secao-carne" data-category="carne">Pratos de Carne:</h2>

    <button class="dish-card padding-sm">
      <img src="assets/images/placeholderDuck.png" alt="Hambúrguer" />
      <div class="info">
        <h3 class="dish-title">Hambúrguer</h3>
        <div class="rating-price">
          <img src="assets/images/star.png" alt="Estrela" class="star" />
          <span class="rating">4,0</span>
          <span class="dot-char">●</span>
          <span class="price">9,00€</span>
        </div>
        <p class="description">Sanduíche de carne grelhada com pão, vegetais e molhos.</p>
      </div>
    </button>

    <button class="dish-card padding-xl">
      <img src="assets/images/placeholderDuck.png" alt="Carne de Porco à Alentejana" />
      <div class="info">
        <h3 class="dish-title">Carne de Porco à Alentejana</h3>
        <div class="rating-price">
          <img src="assets/images/star.png" alt="Estrela" class="star" />
          <span class="rating">4,6</span>
          <span class="dot-char">●</span>
          <span class="price">11,00€</span>
        </div>
        <p class="description">Carne de porco com amêijoas, batatas fritas e coentros.</p>
      </div>
    </button>

    <button class="dish-card padding-sm">
      <img src="assets/images/placeholderDuck.png" alt="Francesinha" />
      <div class="info">
        <h3 class="dish-title">Francesinha</h3>
        <div class="rating-price">
          <img src="assets/images/star.png" alt="Estrela" class="star" />
          <span class="rating">4,2</span>
          <span class="dot-char">●</span>
          <span class="price">9,50€</span>
        </div>
        <p class="description">Sanduíche recheada com carnes, queijo e molho picante.</p>
      </div>
    </button>

    <!-- PEIXE -->
    <h2 id="secao-peixe" data-category="peixe">Pratos de Peixe:</h2>

    <button class="dish-card padding-sm">
      <img src="assets/images/placeholderDuck.png" alt="Bacalhau com Natas" />
      <div class="info">
        <h3 class="dish-title">Bacalhau com Natas</h3>
        <div class="rating-price">
          <img src="assets/images/star.png" alt="Estrela" class="star" />
          <span class="rating">3,3</span>
          <span class="dot-char">●</span>
          <span class="price">8,50€</span>
        </div>
        <p class="description">Bacalhau desfiado com batata, natas e queijo gratinado.</p>
      </div>
    </button>

    <button class="dish-card padding-sm">
      <img src="assets/images/placeholderDuck.png" alt="Dourada Grelhada" />
      <div class="info">
        <h3 class="dish-title">Dourada Grelhada</h3>
        <div class="rating-price">
          <img src="assets/images/star.png" alt="Estrela" class="star" />
          <span class="rating">3,8</span>
          <span class="dot-char">●</span>
          <span class="price">10,00€</span>
        </div>
        <p class="description">Dourada fresca grelhada com batatas e legumes salteados.</p>
      </div>
    </button>

    <button class="dish-card padding-xl">
      <img src="assets/images/placeholderDuck.png" alt="Salmão com Molho de Limão" />
      <div class="info">
        <h3 class="dish-title">Salmão com Molho de Limão</h3>
        <div class="rating-price">
          <img src="assets/images/star.png" alt="Estrela" class="star" />
          <span class="rating">3,9</span>
          <span class="dot-char">●</span>
          <span class="price">11,50€</span>
        </div>
        <p class="description">Filete de salmão grelhado servido com molho leve de limão.</p>
      </div>
    </button>

    <!-- SOBREMESA -->
    <h2 id="secao-sobremesa" data-category="sobremesa">Sobremesas:</h2>

    <button class="dish-card padding-sm">
      <img src="assets/images/placeholderDuck.png" alt="Doce da Casa" />
      <div class="info">
        <h3 class="dish-title">Doce da Casa</h3>
        <div class="rating-price">
          <img src="assets/images/star.png" alt="Estrela" class="star" />
          <span class="rating">4,0</span>
          <span class="dot-char">●</span>
          <span class="price">3,50€</span>
        </div>
        <p class="description">Camadas de bolacha, natas e leite condensado.</p>
      </div>
    </button>

    <button class="dish-card padding-sm">
      <img src="assets/images/placeholderDuck.png" alt="Mousse de Chocolate" />
      <div class="info">
        <h3 class="dish-title">Mousse de Chocolate</h3>
        <div class="rating-price">
          <img src="assets/images/star.png" alt="Estrela" class="star" />
          <span class="rating">3,9</span>
          <span class="dot-char">●</span>
          <span class="price">3,00€</span>
        </div>
        <p class="description">Clássica mousse de chocolate negro caseira.</p>
      </div>
    </button>

    <button class="dish-card padding-sm">
      <img src="assets/images/placeholderDuck.png" alt="Tarte de Maçã" />
      <div class="info">
        <h3 class="dish-title">Tarte de Maçã</h3>
        <div class="rating-price">
          <img src="assets/images/star.png" alt="Estrela" class="star" />
          <span class="rating">4,1</span>
          <span class="dot-char">●</span>
          <span class="price">3,20€</span>
        </div>
        <p class="description">Tarte caseira de maçã servida morna com canela.</p>
      </div>
    </button>

    <div style="height: 20vh;"></div>


  </main>

  <div id="dish-popup-overlay" class="popup-overlay hidden"></div>

  <div id="dish-popup" class="dish-popup hidden">
    <div class="popup-drag-bar"></div>

    <div class="popup-toggle">
      <span class="active">Imagem</span>
      <span>3D</span>
    </div>

    <div class="popup-image">
      <img src="" alt="Imagem do prato" id="popup-img">
    </div>

    <div class="popup-content">
      <h3 id="popup-title">[Nome do Prato]</h3>
      <div class="popup-meta">
        <img src="assets/images/star.png" class="popup-star" alt="Estrela">
        <span class="rating" id="popup-rating">[avaliação]</span>
        <span class="dot-char">●</span>
        <span class="price" id="popup-price">[preço]</span>
      </div>

      <p id="popup-description">[Descrição do prato...]</p>

      <div class="popup-buttons">
        <button class="ar-btn">Ver Prato na Mesa com AR</button>
      </div>

    </div>
  </div>

  <script src="script/script.js"></script>
</body>

</html>
